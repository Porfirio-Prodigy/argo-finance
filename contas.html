<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Financeiro - Contas</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

    <div class="app">

        <!-- MENU -->

        <aside class="sidebar">

            <div class="logo">
                Financeiro
            </div>

            <nav><a href="index.html">Visão geral</a><a href="contas.html" class="active">Contas</a><a href="cartoes.html">Cartões</a><a href="dividas.html">Dívidas</a><a href="calendario.html">Calendário</a><a href="emprestimos.html">Empréstimos</a><a href="investimentos.html">Investimentos</a><a href="relatorios.html">Relatórios</a><a href="ajuda.html">Ajuda</a></nav>

        </aside>


        <!-- CONTEÚDO -->

        <main class="main">

            <section>

                <header class="page-header">

                    <div>

                        <h1>
                            Contas
                        </h1>

                        <p>
                            Gerencie suas contas financeiras.
                        </p>

                    </div>

                    <div class="header-actions"><button id="btnTransferirConta" class="btn-cancelar" type="button">Transferir entre contas</button><button id="btnNovaConta">
                        Nova conta
                    </button></div>

                </header>


                <!-- LISTA DE CONTAS -->

                <div
                    id="listaContas"
                    class="contas-tabela-container"
                >
                </div>

            </section>

            <section class="dashboard-section account-history-section">
                <header class="page-header"><div><h2>Histórico de movimentações</h2><p>Pagamentos de dívidas, transferências e receitas registradas.</p></div><label class="history-filter">Mês <input id="filtroMesMovimentacoes" type="month"></label></header>
                <div id="listaMovimentacoes" class="contas-tabela-container"></div>
            </section>
        </main>

    </div>

    <div id="modalTransferencia" class="modal hidden"><div class="modal-content"><div class="modal-header"><h2>Transferir entre contas</h2><button id="btnFecharTransferencia" class="btn-fechar" type="button">×</button></div><form id="formTransferencia"><div class="form-group"><label for="contaOrigemTransferencia">Da conta</label><select id="contaOrigemTransferencia" required></select></div><div class="form-group"><label for="contaDestinoTransferencia">Para a conta</label><select id="contaDestinoTransferencia" required></select></div><div class="form-row"><div class="form-group"><label for="valorTransferencia">Valor</label><input id="valorTransferencia" type="number" min="0.01" step="0.01" required></div><div class="form-group"><label for="dataTransferencia">Data</label><input id="dataTransferencia" type="date" required></div></div><div class="form-actions"><button id="btnCancelarTransferencia" type="button" class="btn-cancelar">Cancelar</button><button type="submit">Confirmar transferencia</button></div></form></div></div>


    <!-- MODAL -->

    <div
        id="modalConta"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="tituloModal">
                    Nova conta
                </h2>

                <button
                    id="btnFecharModal"
                    class="btn-fechar"
                    type="button"
                >
                    ×
                </button>

            </div>


            <!-- FORMULÁRIO -->

            <form id="formConta">

                <!-- NOME -->

                <div class="form-group">

                    <label for="nomeConta">
                        Nome da conta
                    </label>

                    <input
                        type="text"
                        id="nomeConta"
                        placeholder="Ex: Nubank"
                        required
                    >

                </div>


                <!-- TIPO -->

                <div class="form-group">

                    <label for="tipoConta">
                        Tipo da conta
                    </label>

                    <select
                        id="tipoConta"
                        required
                    >

                        <option value="">
                            Selecione o tipo
                        </option>

                        <option value="Conta corrente">
                            Conta corrente
                        </option>

                        <option value="Conta salário">
                            Conta salário
                        </option>

                        <option value="Poupança">
                            Poupança
                        </option>

                        <option value="Carteira">
                            Carteira
                        </option>

                        <option value="Dinheiro">
                            Dinheiro
                        </option>

                        <option value="Investimento">
                            Investimento
                        </option>

                    </select>

                </div>


                <!-- VALOR -->

                <div class="form-group">

                    <label for="valorConta">
                        Valor
                    </label>

                    <input
                        type="number"
                        id="valorConta"
                        placeholder="0,00"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>


                <!-- AÇÕES -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="btnCancelarConta"
                        class="btn-cancelar"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        id="btnSalvarConta"
                    >
                        Adicionar conta
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
